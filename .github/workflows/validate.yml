name: Validar scripts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensamblar fuentes y respaldos verificados
        run: node scripts/assemble-upload.mjs
      - name: Validar y generar distribución
        run: npm run check
