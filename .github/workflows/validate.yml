name: Validar scripts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-hunt-1-1-12:
    if: github.head_ref == 'publish-hunt-1.1.12-now'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verificar distribución 1.1.12
        run: |
          grep -q '// @version      1.1.12' dist/pokegrid-hunt-intelligence.user.js
          grep -q 'PokeGrid - Hunt Intelligence</strong> <code>v1.1.12</code>' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

  validate:
    if: github.head_ref != 'publish-hunt-1.1.12-now'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensamblar fuentes y respaldos verificados
        run: node scripts/assemble-upload.mjs
      - name: Validar y generar distribución
        run: npm run check
