name: Reparar PIW-QOL completo

# Activación puntual de la reparación completa.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-piw-qol-full.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repair-piw-qol-full
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir fuente completa verificada
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';
          import crypto from 'node:crypto';

          const partsDir = 'dist/piw-qol-es-parts';
          const files = fs.readdirSync(partsDir)
            .filter(name => /^part\d+\.b64$/.test(name))
            .sort();
          if (files.length !== 9) throw new Error(`Se esperaban 9 bloques y hay ${files.length}.`);

          const encoded = files.map(name => fs.readFileSync(path.join(partsDir, name), 'utf8').replace(/\s+/g, '')).join('');
          const source = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
          const hash = crypto.createHash('sha256').update(source).digest('hex');
          const expectedHash = '2ef00b9357c766852709c8d6de7184d369689357f19e7322beff5dcb338e9e8a';
          if (source.length !== 259051) throw new Error(`Tamaño incorrecto: ${source.length}.`);
          if (hash !== expectedHash) throw new Error(`SHA-256 incorrecto: ${hash}.`);

          const text = source.toString('utf8');
          if (!text.includes('// @version      9.10.24')) throw new Error('No aparece la versión 9.10.24.');
          if (!text.includes('// @updateURL     https://losajr.github.io/PokeIdleWorld-Scripts/piw-qol-es.meta.js')) throw new Error('Falta @updateURL correcta.');
          if (!text.includes('// @downloadURL   https://losajr.github.io/PokeIdleWorld-Scripts/piw-qol-es.user.js')) throw new Error('Falta @downloadURL correcta.');
          if (text.includes('@require      https://cdn.jsdelivr.net/npm/pako')) throw new Error('La fuente completa no debe depender de pako.');

          fs.writeFileSync('src/piw-qol-es.user.js', source);
          console.log(`Fuente reconstruida: ${source.length} bytes; SHA-256 ${hash}.`);
          NODE

      - name: Comprobar sintaxis
        run: node --check src/piw-qol-es.user.js

      - name: Regenerar distribución completa
        run: |
          npm run build
          rm -rf dist
          cp -R .staging/dist dist

      - name: Validar resultado final
        run: |
          npm run validate
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const src = fs.readFileSync('src/piw-qol-es.user.js');
          const dist = fs.readFileSync('dist/piw-qol-es.user.js');
          const digest = value => crypto.createHash('sha256').update(value).digest('hex');
          if (!src.equals(dist)) throw new Error('src y dist no son idénticos.');
          if (src.length !== 259051) throw new Error(`Tamaño final incorrecto: ${src.length}.`);
          if (digest(src) !== '2ef00b9357c766852709c8d6de7184d369689357f19e7322beff5dcb338e9e8a') throw new Error('Hash final incorrecto.');
          if (fs.existsSync('dist/piw-qol-es-parts')) throw new Error('La carpeta de bloques no fue eliminada.');
          const meta = fs.readFileSync('dist/piw-qol-es.meta.js', 'utf8');
          if (meta.includes('@require')) throw new Error('El meta conserva @require.');
          const manifest = fs.readFileSync('dist/manifest.json', 'utf8');
          if (manifest.includes('raw.githubusercontent.com/LosaJR/PokeIdleWorld-Scripts/main/dist/piw-qol-es')) throw new Error('El manifiesto conserva URLs raw incorrectas.');
          const index = fs.readFileSync('dist/index.html', 'utf8');
          if (!index.includes('href="piw-qol-es.user.js"')) throw new Error('El índice no usa el enlace relativo correcto.');
          console.log(`Resultado verificado: ${src.length} bytes, 4.497 líneas y SHA-256 ${digest(src)}.`);
          NODE

      - name: Retirar workflow puntual y guardar reparación
        run: |
          rm -f .github/workflows/repair-piw-qol-full.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publicar PIW-QOL 9.10.24 completo [skip ci]"
          git push origin main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
