name: Publicar scripts

# Runner explícito para evitar fallos de inicialización observados en ubuntu-latest.
# Los PR fusionados contra main y las cargas directas en incoming/ publican automáticamente desde main.
on:
  push:
    branches: [main]
    paths:
      - 'incoming/**'
      - 'src/**'
      - 'staging-upload/**'
      - 'scripts/**'
      - 'config/repository.json'
      - 'package.json'
      - '.github/workflows/publish.yml'
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar release 2026-08-10
        run: python3 scripts/apply-release-2026-08-10.py

      - name: Normalizar regex temporal de Capture Log
        run: |
          python3 - <<'PY'
          from pathlib import Path
          q = Path('src/piw-qol-es.user.js')
          text = q.read_text(encoding='utf-8')
          text = text.replace('\x08IV', r'\bIV')
          q.write_text(text, encoding='utf-8')
          w = Path('.github/workflows/publish.yml')
          workflow = w.read_text(encoding='utf-8')
          block = """      - name: Normalizar regex temporal de Capture Log
                run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  q = Path('src/piw-qol-es.user.js')
                  text = q.read_text(encoding='utf-8')
                  text = text.replace('\\x08IV', r'\\bIV')
                  q.write_text(text, encoding='utf-8')
                  w = Path('.github/workflows/publish.yml')
                  workflow = w.read_text(encoding='utf-8')
                  block = __BLOCK__
                  if block not in workflow:
                      raise SystemExit('No se encontró el bloque temporal de normalización')
                  w.write_text(workflow.replace(block, ''), encoding='utf-8')
                  PY

          """
          block = block.replace('__BLOCK__', repr(block))
          if block not in workflow:
              # Fallback más simple: elimina desde el nombre del step hasta el siguiente step.
              start = workflow.find('      - name: Normalizar regex temporal de Capture Log\n')
              end = workflow.find('      - name: Procesar bandeja incoming\n', start)
              if start < 0 or end < 0:
                  raise SystemExit('No se encontró el step temporal para autolimpieza')
              workflow = workflow[:start] + workflow[end:]
          else:
              workflow = workflow.replace(block, '')
          w.write_text(workflow, encoding='utf-8')
          PY

      - name: Procesar bandeja incoming
        run: node scripts/process-incoming.mjs

      - name: Ensamblar una carga preparada
        run: node scripts/assemble-upload.mjs

      - name: Validar versiones y cabeceras
        run: npm run validate

      - name: Generar distribución
        run: npm run build

      - name: Rotar respaldo y publicar
        run: npm run publish:local

      - name: Eliminar respaldos heredados de reemplazos
        run: node scripts/cleanup-replacements.mjs

      - name: Guardar fuentes, dist y el único respaldo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publicar scripts [skip ci]"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
