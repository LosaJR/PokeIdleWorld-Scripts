name: Publicar scripts

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'staging-upload/**'
      - 'scripts/**'
      - 'config/repository.json'
      - 'package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensamblar una carga preparada
        run: node scripts/assemble-upload.mjs

      - name: Validar versiones y cabeceras
        run: npm run validate

      - name: Generar distribución
        run: npm run build

      - name: Rotar respaldo y publicar
        run: npm run publish:local

      - name: Guardar fuentes, dist y el único respaldo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publicar scripts [skip ci]"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
