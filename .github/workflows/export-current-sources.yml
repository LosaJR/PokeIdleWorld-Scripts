name: Exportar fuentes actuales

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar userscripts actuales
        uses: actions/upload-artifact@v4
        with:
          name: current-userscripts
          path: src/*.user.js
          if-no-files-found: error
