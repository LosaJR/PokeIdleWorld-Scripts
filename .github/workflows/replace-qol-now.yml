name: Sustituir PIW-QOL ahora

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-qol-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-files:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensamblar sustitución
        run: node scripts/assemble-upload.mjs
      - name: Generar distribución
        run: npm run build
      - name: Publicar distribución
        run: npm run publish:local
      - name: Eliminar respaldo heredado
        run: node scripts/cleanup-replacements.mjs
      - name: Guardar sustitución
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sustituir PIW-QOL por 9.10.24 [skip ci]"
            git push origin main
          fi

  deploy-pages:
    needs: publish-files
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
